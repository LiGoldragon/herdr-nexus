[package]
name = "herdr-nexus-wire"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal = { workspace = true }
signal-herdr-nexus = { workspace = true }
core-meta-herdr-nexus = { path = "../core-meta" }
meta-signal-herdr-nexus.workspace = true
shared-translator.workspace = true
nix = { version = "0.30", features = ["socket", "fs"] }
libc = "0.2"
rustix = { version = "1", features = ["fs"] }

[lints.rust]
unsafe_code = "deny"
