[package]
name = "herdr-nexus-wire"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
datom = [
  "dep:datom-codec",
  "dep:protos",
  "signal-herdr-nexus/datom",
  "core-meta-herdr-nexus/datom",
  "meta-signal-herdr-nexus/datom",
  "shared-translator/datom",
]

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "eabead4", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "3c7ade3", optional = true }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal = { workspace = true }
signal-herdr-nexus = { workspace = true }
core-meta-herdr-nexus = { path = "../core-meta" }
meta-signal-herdr-nexus.workspace = true
shared-translator.workspace = true
nix = { version = "0.30", features = ["socket"] }
libc = "0.2"

[lints.rust]
unsafe_code = "forbid"
