[package]
name = "herdr-nexus-translator"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
protos = { git = "https://github.com/LiGoldragon/protos", rev = "15b41da8f2579e73ead59bc0c2b97529b8ac32d3", optional = true }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "e26d90ff185d54bc0007b19a8d9bc390c6bfeb12", optional = true }

[dependencies.signal-herdr-nexus]
git = "https://github.com/LiGoldragon/signal-herdr-nexus"
rev = "2a6c8883bb9ce1ac9467c359bd323c3aa895d580"

[dependencies.shared-translator]
package = "translator"
git = "https://github.com/LiGoldragon/translator"
rev = "c38b0529437ae452c7047c6ace920c58e4c1f0fc"


[features]
default = []
text = ["dep:protos", "dep:datom-codec", "signal-herdr-nexus/datom", "shared-translator/text"]


[dependencies.emission-herdr-nexus]
path = "../emission"

[dependencies.meta-signal-herdr-nexus]
package = "meta-signal-herdr-nexus"
git = "https://github.com/LiGoldragon/meta-signal-herdr-nexus"
rev = "0e3c7abee1c2939793b88ca6a39b991b2a17de64"
features = ["datom"]

[[bin]]
name = "herdr-nexus"
path = "src/bin/herdr-nexus.rs"
required-features = ["text"]
[[bin]]
name = "herdr-nexus-meta"
path = "src/bin/herdr-nexus-meta.rs"
required-features = ["text"]
[[bin]]
name = "herdr-nexus-place"
path = "src/bin/herdr-nexus-place.rs"
required-features = ["text"]
