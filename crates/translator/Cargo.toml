[package]
name = "herdr-nexus-translator"
version = "0.2.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
herdr-nexus-wire = { path = "../wire" }
core-meta-herdr-nexus = { path = "../core-meta" }
nix = { version = "0.30", features = ["fs", "poll", "process", "signal", "socket", "user"] }
rustix = { version = "1", features = ["process", "rand"] }
rkyv = { version = "0.8", features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "7afb68b" }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "3c7ade3", optional = true }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "eabead4", optional = true }

[dependencies.signal-herdr-nexus]
git = "https://github.com/LiGoldragon/signal-herdr-nexus"
rev = "7c724f8"

[dependencies.shared-translator]
package = "translator"
git = "https://github.com/LiGoldragon/translator"
rev = "1b0e38b"
features = ["unix"]


[features]
default = []
text = ["datom", "dep:protos", "dep:datom-codec", "signal-herdr-nexus/datom", "shared-translator/text"]
datom = []


[dependencies.emission-herdr-nexus]
path = "../emission"

[dependencies.meta-signal-herdr-nexus]
package = "meta-signal-herdr-nexus"
git = "https://github.com/LiGoldragon/meta-signal-herdr-nexus"
rev = "5b89490"
features = ["datom"]

[[bin]]
name = "herdr-nexus"
path = "src/bin/herdr-nexus.rs"
required-features = ["text"]
[[bin]]
name = "herdr-nexus-meta"
path = "src/bin/herdr-nexus-meta.rs"
required-features = ["text"]
[[bin]]
name = "herdr-nexus-place"
path = "src/bin/herdr-nexus-place.rs"
required-features = ["text"]

[[bin]]
name = "herdr-translator"
path = "src/bin/herdr-translator.rs"
required-features = ["text"]

[[bin]]
name = "herdr-pair"
path = "src/bin/herdr-pair.rs"
required-features = ["text"]
