[package]
name = "core-meta-herdr-nexus"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
datom = ["meta-signal-herdr-nexus/datom", "translator/datom", "dep:datom-codec", "dep:protos"]

[dependencies]
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal.workspace = true
meta-signal-herdr-nexus.workspace = true
translator.workspace = true
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09a0526", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "c93b598", optional = true }

[lints.rust]
unsafe_code = "forbid"
