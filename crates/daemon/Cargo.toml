[package]
name = "herdr-nexus-daemon"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
herdr-nexus-core = { path = "../core" }
emission-herdr-nexus = { path = "../emission" }
core-meta-herdr-nexus = { path = "../core-meta" }
herdr-nexus-wire = { path = "../wire" }
signal-herdr-nexus.workspace = true
meta-signal-herdr-nexus.workspace = true
signal.workspace = true
shared-translator.workspace = true
nix = { version = "0.30", features = ["fs", "poll", "user"] }
rustix = { version = "1", features = ["event", "process"] }

[lints.rust]
unsafe_code = "forbid"
