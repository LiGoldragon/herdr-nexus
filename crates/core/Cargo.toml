[package]
name = "herdr-nexus-core"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
datom = [
  "dep:datom-codec",
  "dep:protos",
  "signal-herdr-nexus/datom",
  "translator/datom",
]

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "eabead4", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "3c7ade3", optional = true }
signal-herdr-nexus.workspace = true
translator.workspace = true
emission-herdr-nexus = { path = "../emission" }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }

[lints.rust]
unsafe_code = "forbid"
