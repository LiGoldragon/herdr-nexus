[workspace]
members = ["crates/core", "crates/daemon", "crates/emission", "crates/translator"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89"

[workspace.dependencies]
signal-herdr-nexus = { git = "https://github.com/LiGoldragon/signal-herdr-nexus", rev = "2a6c8883bb9ce1ac9467c359bd323c3aa895d580", default-features = false }
meta-signal-herdr-nexus = { git = "https://github.com/LiGoldragon/meta-signal-herdr-nexus", rev = "0e3c7abee1c2939793b88ca6a39b991b2a17de64", default-features = false }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "0cad1d1aeddec7da2971dc88e964320a6db48c20", default-features = false }
shared-translator = { package = "translator", git = "https://github.com/LiGoldragon/translator", rev = "c38b0529437ae452c7047c6ace920c58e4c1f0fc", default-features = false }
