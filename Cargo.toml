[workspace]
members = ["crates/core", "crates/core-meta", "crates/daemon", "crates/emission", "crates/translator", "crates/wire"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89"

[workspace.dependencies]
signal-herdr-nexus = { git = "https://github.com/LiGoldragon/signal-herdr-nexus", rev = "10de08f", default-features = false }
meta-signal-herdr-nexus = { git = "https://github.com/LiGoldragon/meta-signal-herdr-nexus", rev = "c8edfb4", default-features = false }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "d77169d", default-features = false }
shared-translator = { package = "translator", git = "https://github.com/LiGoldragon/translator", rev = "27da70f", default-features = false, features = ["unix"] }
translator = { git = "https://github.com/LiGoldragon/translator", rev = "27da70f", default-features = false }
